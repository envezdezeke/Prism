# Read (Phase 3) settings. Generic words only: form titles, field labels, common English words.
# No company, person, EIN or folder name from any sample belongs here (guard test enforces it).
#
# Schema (every section is also reachable as ReadConfig.raw[<name>]):
#   quiet_minutes   J11 quiet window; must equal config/move.yaml quiet_minutes
#   limits          max_bytes / max_pages / max_chars caps for untrusted input
#   confidence      label, table, ocr, range, inferred, vl (UI bins: High >= 0.9, Medium >= 0.6)
#   classify        title_lines, min_score, image_default_class, signals (per class list of
#                   {kind: phrase|regex|csv_headers, text|pattern|tokens, weight, where: title|any})
#   labels.<class>  field -> list of label synonyms (casefolded, whole-line or "label: value")
#   stops           label-block terminators ("text" exact line, "text*" prefix)

quiet_minutes: 30

limits:
  max_bytes: 26214400     # 25 MB
  max_pages: 80
  max_chars: 400000
  max_images: 6           # embedded images OCR'd per file

confidence:
  label: 0.95
  table: 0.9
  ocr: 0.6
  range: 0.5
  inferred: 0.5
  vl: 0.55
  keyword: 0.6          # purpose chosen from a keyword hit

classify:
  title_lines: 6
  min_score: 3.0
  image_default_class: guarantor_id
  period:                # statement period label synonyms (value holds the date range)
    labels: ["Statement period", "Period", "Statement date range"]
  signals:
    application:
      - {kind: phrase, text: "small business loan application", weight: 3.0, where: title}
      - {kind: phrase, text: "legal business name", weight: 1.0, where: any}
      - {kind: phrase, text: "amount requested", weight: 1.0, where: any}
      - {kind: phrase, text: "automatic extension", weight: -5.0, where: any}
    guarantor_id:
      - {kind: regex, pattern: 'driver''?s?\s+licen[cs]e', weight: 3.0, where: title}
      - {kind: phrase, text: "dl number", weight: 1.0, where: any}
      - {kind: phrase, text: "date of birth", weight: 0.5, where: any}
      - {kind: phrase, text: "expires", weight: 0.5, where: any}
      - {kind: phrase, text: "small business loan application", weight: -5.0, where: title}
    certificate_of_formation:
      - {kind: phrase, text: "certificate of formation", weight: 3.0, where: title}
      - {kind: phrase, text: "filing acknowledgment", weight: 1.0, where: title}
      - {kind: phrase, text: "secretary of state", weight: 1.0, where: any}
      - {kind: phrase, text: "registered agent", weight: 1.0, where: any}
      - {kind: phrase, text: "file number", weight: 0.5, where: any}
    ein_letter:
      - {kind: regex, pattern: 'irs\s+notice|\bcp\s?575\b', weight: 3.0, where: title}
      - {kind: phrase, text: "ein assigned", weight: 1.0, where: title}
      - {kind: phrase, text: "employer identification number", weight: 1.0, where: any}
      - {kind: phrase, text: "date of notice", weight: 0.5, where: any}
    bank_statement:
      - {kind: phrase, text: "business checking statement", weight: 3.0, where: title}
      - {kind: phrase, text: "opening balance", weight: 1.0, where: any}
      - {kind: phrase, text: "closing balance", weight: 1.0, where: any}
      - {kind: phrase, text: "statement period", weight: 1.0, where: any}
      - {kind: phrase, text: "total deposits", weight: 0.5, where: any}
      - {kind: csv_headers, tokens: ["date", "amount", "bal"], weight: 4.0}
    financial_statements:
      - {kind: phrase, text: "financial statements", weight: 3.0, where: title}
      - {kind: phrase, text: "profit & loss", weight: 1.0, where: any}
      - {kind: phrase, text: "balance sheet", weight: 1.0, where: any}
      - {kind: phrase, text: "prepared by", weight: 0.5, where: any}
    tax_return:
      - {kind: phrase, text: "income tax return", weight: 3.0, where: title}
      - {kind: phrase, text: "gross receipts", weight: 1.0, where: any}
      - {kind: phrase, text: "ordinary business income", weight: 1.0, where: any}
      - {kind: phrase, text: "paid preparer", weight: 0.5, where: any}
      - {kind: phrase, text: "automatic extension", weight: -5.0, where: any}
      - {kind: phrase, text: "extended due date", weight: -5.0, where: any}
    form_7004:
      - {kind: phrase, text: "form 7004", weight: 3.0, where: title}
      - {kind: phrase, text: "automatic extension", weight: 1.0, where: title}
      - {kind: phrase, text: "extended due date", weight: 1.0, where: any}
      - {kind: phrase, text: "tax year", weight: 0.5, where: any}
    request_letter:
      - {kind: regex, pattern: '(?m)^\s*re:\s*loan request', weight: 3.0, where: title}
      - {kind: phrase, text: "we are requesting", weight: 1.0, where: any}
      - {kind: phrase, text: "small business loan application", weight: -5.0, where: title}
    equipment_quote:
      - {kind: regex, pattern: '(?m)^\s*(quotation|quote)\b', weight: 3.0, where: title}
      - {kind: phrase, text: "remit to", weight: 1.5, where: any}
      - {kind: phrase, text: "account ending", weight: 1.0, where: any}
      - {kind: phrase, text: "total", weight: 0.5, where: any}

stops:
  - "Section*"
  - "I certify*"
  - "/s/*"

labels:
  application:
    legal_name: ["Legal business name", "Legal name", "Business legal name"]
    dba: ["DBA / trade name", "DBA", "Trade name", "Doing business as"]
    ein: ["Federal EIN", "EIN", "Employer identification number", "Federal tax ID"]
    entity_type: ["Entity type / state", "Entity type", "Type of entity"]
    formation_date: ["Date business established", "Date established", "Date of formation", "Business start date"]
    business_address: ["Business address", "Address of business", "Principal business address"]
    business_phone_email: ["Business phone / email", "Business phone", "Phone / email"]
    industry: ["Industry (NAICS)", "Industry", "NAICS"]
    employees: ["Number of employees", "Employees"]
    revenue: ["Annual revenue (most recent year)", "Annual revenue", "Annual gross revenue"]
    bank: ["Primary bank / account", "Primary bank", "Bank / account"]
    amount_requested: ["Amount requested", "Loan amount", "Requested amount"]
    product: ["Product", "Loan product", "Product type"]
    purpose: ["Use of proceeds", "Purpose of loan", "Loan purpose"]
    term: ["Requested term", "Term requested", "Loan term"]
    collateral: ["Collateral offered", "Collateral"]
    needed_by: ["Funds needed by", "Needed by", "Date funds needed"]
    guarantor_name: ["Name", "Guarantor name", "Owner name"]
    guarantor_title: ["Title / ownership", "Title", "Ownership"]
    guarantor_dob: ["Date of birth", "DOB"]
    guarantor_ssn: ["SSN", "Social security number"]
    guarantor_address: ["Home address", "Residence address"]
    guarantor_dl: ["Driver license", "Driver's license", "Driver license number"]
    affiliated: ["Affiliated businesses", "Affiliates"]
    application_date: ["Application date", "Date of application", "Date submitted"]

sections:                # heading regexes (applied per line); the guarantor section is the owner block
  business: ['^\s*section\s+\w+\W+business']
  loan: ['^\s*section\s+\w+\W+loan']
  guarantor: ['^\s*section\s+\w+\W+.*(owner|guarantor)']

none_markers:            # a label present with one of these values is "declared none", not missing
  - "no specific date"
  - "n/a"
  - "na"
  - "none"
  - "not provided"
  - "not applicable"
  - "tbd"
  - "unknown"
  - "-"
  - "--"
  - "–"
  - "—"

signature:
  markers: ["/s/"]
  labels: ["Signature", "Signed by", "Applicant signature"]

product_synonyms:        # first contained phrase wins (casefolded); values are the four Product enums
  "revolving line of credit": "Revolving Line of Credit"
  "line of credit": "Revolving Line of Credit"
  "revolving": "Revolving Line of Credit"
  "loc": "Revolving Line of Credit"
  "equipment loan": "Equipment Loan"
  "equipment financing": "Equipment Loan"
  "equipment": "Equipment Loan"
  "working capital loan": "Working Capital Loan"
  "working capital": "Working Capital Loan"
  "term loan": "Term Loan"
  "term": "Term Loan"

purpose_keywords:        # ordered; first category with a hit wins; short words match whole words
  - {category: payroll, words: ["payroll", "wages", "salar"]}
  - {category: refinance, words: ["refinanc", "pay off", "payoff", "consolidat"]}
  - {category: equipment, words: ["equipment", "vehicle", "truck", "trailer", "tractor", "van", "printer", "lift", "machine", "oven", "cooler", "mower", "forklift", "press"]}
  - {category: expansion, words: ["expan", "hire", "hiring", "pilot", "launch", "new location", "second location", "open a"]}
  - {category: inventory, words: ["inventory", "stock"]}
  - {category: working_capital, words: ["receivable", "working capital", "bridge", "operating", "cash flow", "seasonal"]}

term_units:
  months: ["month", "months", "mo", "mos"]
  years: ["year", "years", "yr", "yrs"]

nicknames:               # groups of a formal first name and its common short forms (generic English)
  - [robert, bob, rob, bobby, bert, robbie]
